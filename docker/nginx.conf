# Auslieferung des Godot-Web-Exports.
#
# Zwei Dinge sind hier wichtig:
#  1. .wasm muss als application/wasm ausgeliefert werden, sonst
#     verweigert der Browser das Kompilieren.
#  2. Die Cross-Origin-Isolation-Header schaden nicht und werden
#     gebraucht, falls der Export später mit Thread-Unterstützung
#     gebaut wird (SharedArrayBuffer).

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Beim Bauen vorkomprimierte .gz-Dateien direkt ausliefern:
    # das 34-MB-WebAssembly bei jeder Anfrage neu zu packen wäre teuer.
    gzip_static on;
    gzip off;

    types {
        text/html                             html;
        text/javascript                       js;
        application/wasm                      wasm;
        application/json                      json;
        image/png                             png;
        image/svg+xml                         svg;
        application/octet-stream              pck;
    }
    default_type application/octet-stream;

    add_header Cross-Origin-Opener-Policy   "same-origin"   always;
    add_header Cross-Origin-Embedder-Policy "require-corp"  always;
    add_header X-Content-Type-Options       "nosniff"       always;

    # Die Einstiegsseite ist nur eine Weiterleitung auf /spiel/<Baukennung>/
    # und darf NIE im Zwischenspeicher liegen – sonst landet man auf ewig
    # beim alten Bau. Sie ist ein paar hundert Byte groß.
    location = /index.html {
        add_header Cache-Control "no-store" always;
        add_header Cross-Origin-Opener-Policy   "same-origin"   always;
        add_header Cross-Origin-Embedder-Policy "require-corp"  always;
    }

    # Welcher Stand läuft hier? Zum Nachsehen von außen.
    location = /fassung.txt {
        add_header Cache-Control "no-store" always;
        default_type text/plain;
    }

    # Die Spieldaten. Ihr Pfad enthält die Baukennung, ändert sich also bei
    # jedem Bau. Deshalb dürfen sie beliebig lange liegen bleiben: Ein neuer
    # Bau hat neue Adressen und wird zwangsläufig geholt. Genau das heilt
    # auch Browser, die vom alten Abbild noch ein Jahr "immutable" auf
    # index.pck sitzen haben.
    location /spiel/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Cross-Origin-Opener-Policy   "same-origin"   always;
        add_header Cross-Origin-Embedder-Policy "require-corp"  always;
    }

    location /gesundheit {
        access_log off;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
