# Auslieferung des Godot-Web-Exports.
#
# Zwei Dinge sind hier wichtig:
#  1. .wasm muss als application/wasm ausgeliefert werden, sonst
#     verweigert der Browser das Kompilieren.
#  2. Die Cross-Origin-Isolation-Header schaden nicht und werden
#     gebraucht, falls der Export später mit Thread-Unterstützung
#     gebaut wird (SharedArrayBuffer).

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Beim Bauen vorkomprimierte .gz-Dateien direkt ausliefern:
    # das 34-MB-WebAssembly bei jeder Anfrage neu zu packen wäre teuer.
    gzip_static on;
    gzip off;

    types {
        text/html                             html;
        text/javascript                       js;
        application/wasm                      wasm;
        application/json                      json;
        image/png                             png;
        image/svg+xml                         svg;
        application/octet-stream              pck;
    }
    default_type application/octet-stream;

    add_header Cross-Origin-Opener-Policy   "same-origin"   always;
    add_header Cross-Origin-Embedder-Policy "require-corp"  always;
    add_header X-Content-Type-Options       "nosniff"       always;

    # Spieldaten dürfen lange im Cache liegen, index.html nie.
    location = /index.html {
        add_header Cache-Control "no-store" always;
        add_header Cross-Origin-Opener-Policy   "same-origin"   always;
        add_header Cross-Origin-Embedder-Policy "require-corp"  always;
    }

    location ~* \.(wasm|pck|js|png|svg)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Cross-Origin-Opener-Policy   "same-origin"   always;
        add_header Cross-Origin-Embedder-Policy "require-corp"  always;
    }

    location /gesundheit {
        access_log off;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
