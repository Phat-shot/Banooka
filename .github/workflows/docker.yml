# Baut das Spiel als Web-Version, packt sie in ein nginx-Abbild und
# veröffentlicht es in der GitHub Container Registry.
#
# Danach genügt auf einem beliebigen Rechner mit Docker:
#   docker run --rm -p 8080:80 ghcr.io/<benutzer>/banooka:latest
# und das Spiel läuft im Browser.

name: Web-Abbild bauen und veröffentlichen

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  abbild:
    name: Docker-Abbild
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Quellcode holen
        uses: actions/checkout@v4

      - name: Buildx einrichten
        uses: docker/setup-buildx-action@v3

      - name: An der Registry anmelden
        # Bei Pull Requests nicht anmelden – dort wird nur gebaut, nicht veröffentlicht.
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Baukennung bestimmen
        id: kennung
        # Kurze, dateisystemtaugliche Kennung des Commits. Sie landet im
        # Auslieferungspfad (/spiel/<Kennung>/), damit jeder Bau eigene
        # Adressen bekommt und kein Browser einen alten Stand festhält.
        run: echo "kurz=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Namen und Marken bestimmen
        id: marken
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Bauen und veröffentlichen
        id: bau
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          build-args: |
            BAU_KENNUNG=${{ steps.kennung.outputs.kurz }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.marken.outputs.tags }}
          labels: ${{ steps.marken.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Abbild ausprobieren
        # Nur wenn veröffentlicht wurde – sonst gibt es kein Abbild zum Ziehen.
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          # Genau das eben gebaute Abbild prüfen, angesprochen über seinen
          # Digest. Über die wandernde Marke ":main" ging das schief, sobald
          # zwei Pushes dicht aufeinander folgten: Dann lag dort schon der
          # nächste Bau, und der Test verglich mit dem falschen Stand.
          # Kleinschreiben: Docker verlangt kleine Namen, und
          # github.repository liefert die Schreibweise von GitHub
          # ("Phat-shot/Banooka"). Die Marken-Action macht das von selbst,
          # ein handgebauter Verweis nicht.
          REPO="$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          MARKE="${{ env.REGISTRY }}/$REPO@${{ steps.bau.outputs.digest }}"
          echo "geprüft wird: $MARKE"
          docker run -d --name banooka-test -p 8080:80 "$MARKE"
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/gesundheit >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          KENNUNG="${{ steps.kennung.outputs.kurz }}"
          SPIEL="http://localhost:8080/spiel/$KENNUNG"

          echo "--- Einstiegsseite ---"
          curl -fsS -o startseite.html -w 'index.html: HTTP %{http_code}, %{content_type}\n' \
            http://localhost:8080/
          # Sie muss auf den Bau dieses Commits zeigen und darf nicht
          # zwischengespeichert werden – sonst hängt der Browser am alten Stand.
          grep -q "/spiel/$KENNUNG/index.html" startseite.html \
            || { echo "FEHLER: Startseite zeigt nicht auf /spiel/$KENNUNG/"; cat startseite.html; exit 1; }
          curl -fsSI http://localhost:8080/ | grep -qi 'cache-control: no-store' \
            || { echo "FEHLER: Startseite wird zwischengespeichert"; exit 1; }

          echo "--- Fassung ---"
          curl -fsS http://localhost:8080/fassung.txt
          curl -fsS http://localhost:8080/fassung.txt | grep -q "$KENNUNG" \
            || { echo "FEHLER: /fassung.txt nennt nicht $KENNUNG"; exit 1; }

          echo "--- Spieldaten ---"
          curl -fsS -o /dev/null -w 'index.wasm: HTTP %{http_code}, %{content_type}, %{size_download} Bytes\n' \
            -H 'Accept-Encoding: gzip' "$SPIEL/index.wasm"
          curl -fsS -o /dev/null -w 'index.pck:  HTTP %{http_code}, %{size_download} Bytes\n' \
            -H 'Accept-Encoding: gzip' "$SPIEL/index.pck"

          echo "--- Header ---"
          curl -fsSI http://localhost:8080/ | grep -i cross-origin
          docker rm -f banooka-test
